# ES: Topología productiva con servicios internos detrás del borde Nginx.
# EN: Production topology with internal application services behind the Nginx edge.
x-app: &app
  build:
    context: .
    args:
      REQUIREMENTS_FILE: production.txt
  image: vinova-pro:2.0.0
  env_file:
    - ${VINOVA_ENV_FILE:-.env}
  environment: &app-environment
    DJANGO_SETTINGS_MODULE: config.settings.production
    DEBUG: "False"
    VINOVA_TRUST_PROXY_HEADERS: "True"
    VINOVA_BACKUP_SYNC_FALLBACK: "False"
    VINOVA_REQUIRE_CELERY_READY: "True"
  networks:
    - backend
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  group_add:
    - "${VINOVA_SHARED_ASSETS_GID:-101}"
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  volumes:
    - staticfiles:/app/staticfiles
    - media:/app/media
    - private:/app/private
    - app_run:/app/run
  logging: &app-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

# ES: La sección siguiente declara servicios, dependencias y límites de la topología operativa.
# EN: The following section declares services, dependencies, and operational topology limits.
services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *app-logging

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: >-
      sh -c 'if [ -n "$${REDIS_PASSWORD:-}" ]; then
      exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}";
      else exec redis-server --appendonly yes; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD:-}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *app-logging

  app_init:
    <<: *app
    command: >-
      sh -c "python scripts/wait_for_dependencies.py &&
      python manage.py check --deploy --settings=config.settings.production &&
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      python scripts/normalize_shared_assets.py"
    depends_on:
      redis:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app
    command: gunicorn -c config/gunicorn.conf.py config.wsgi:application
    depends_on:
      app_init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header Host:$${VINOVA_HEALTHCHECK_HOST:?Configure VINOVA_HEALTHCHECK_HOST} --header X-Forwarded-Proto:https http://127.0.0.1:8000/health/ready/)\" = 200"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    restart: unless-stopped

  celery_worker:
    <<: *app
    command: celery -A config worker -l info -Q default,backups,webhooks --hostname=celery@%h --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    depends_on:
      app_init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$${HOSTNAME} --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  celery_beat:
    <<: *app
    command: celery -A config beat -l info --pidfile=/app/run/celerybeat.pid --schedule=/app/run/celerybeat-schedule
    depends_on:
      app_init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /app/run/celerybeat.pid && kill -0 $$(cat /app/run/celerybeat.pid)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  nginx:
    build:
      context: docker/nginx
    image: vinova-pro-nginx:2.0.0
    environment:
      NGINX_TLS_ENABLED: ${NGINX_TLS_ENABLED:-false}
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-25m}
      NGINX_PROXY_READ_TIMEOUT: ${NGINX_PROXY_READ_TIMEOUT:-120s}
      NGINX_LOGIN_RATE: ${NGINX_LOGIN_RATE:-10r/m}
      NGINX_LOGIN_BURST: ${NGINX_LOGIN_BURST:-10}
      NGINX_FORWARDED_PROTO: ${NGINX_FORWARDED_PROTO:-http}
      NGINX_TRUSTED_PROXY_CIDR: ${NGINX_TRUSTED_PROXY_CIDR:-}
      NGINX_SSL_CERTIFICATE: ${NGINX_SSL_CERTIFICATE:-/etc/nginx/certs/fullchain.pem}
      NGINX_SSL_CERTIFICATE_KEY: ${NGINX_SSL_CERTIFICATE_KEY:-/etc/nginx/certs/privkey.pem}
    volumes:
      - staticfiles:/app/staticfiles:ro
      - media:/app/media:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:8080"
      - "443:8443"
    networks:
      - edge
      - backend
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *app-logging

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres_data:
  redis_data:
  staticfiles:
  media:
  private:
  app_run:
