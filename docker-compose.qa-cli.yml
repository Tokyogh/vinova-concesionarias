# ES: Stack QA autónomo; excluye deliberadamente los archivos de entorno empresariales.
# EN: Standalone QA stack; intentionally excludes enterprise environment files.
services:
  qa_db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: vinova_qa
      POSTGRES_PASSWORD: vinova_qa
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
# ES: La sección siguiente declara servicios, dependencias y límites de la topología operativa.
# EN: The following section declares services, dependencies, and operational topology limits.
      test: ["CMD-SHELL", "pg_isready -U vinova_qa -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: "no"
    networks:
      - qa_internal

  qa_redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: redis-server --save "" --appendonly no
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: "no"
    networks:
      - qa_internal

  qa_runner:
    build:
      context: .
      dockerfile: docker/qa/Dockerfile
    init: true
    environment:
      VINOVA_QA_DATABASE_ADMIN_URL: postgresql://vinova_qa:vinova_qa@qa_db:5432/postgres
      VINOVA_QA_ALLOWED_DB_HOSTS: qa_db
      VINOVA_QA_REDIS_URL: redis://qa_redis:6379/0
      VINOVA_QA_REPORT_ROOT: /app/private/qa_reports
      VINOVA_QA_ENVIRONMENT: docker-cli-isolated
      VINOVA_QA_IGNORE_PROJECT_ENV: "True"
      VINOVA_QA_RUNTIME_ROOT: /tmp/vinova-qa-runtime
      PRIVATE_STORAGE_ROOT: /tmp/vinova-qa-runtime/private
      VINOVA_QA_PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      RUFF_CACHE_DIR: /tmp/vinova-qa-cache/ruff
      XDG_CACHE_HOME: /tmp/vinova-qa-cache
      PYTEST_ADDOPTS: "-o cache_dir=/tmp/vinova-qa-cache/pytest"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    command: python scripts/vinova_qa.py --profile ${VINOVA_QA_PROFILE:-quick}
    volumes:
      # Ejecuta siempre el código actual del host sin reconstruir la imagen.
      # El proyecto permanece de solo lectura y los reportes conservan escritura.
      - ./:/app:ro
      - ./private/qa_reports:/app/private/qa_reports
    depends_on:
      qa_db:
        condition: service_healthy
      qa_redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - qa_internal

networks:
  qa_internal:
    internal: true
